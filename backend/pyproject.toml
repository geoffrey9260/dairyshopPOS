[project]
name = "dairy-shop-backend"
version = "0.1.0"
description = "FastAPI backend for a dairy shop POS and inventory system"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.128.8",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.39.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
