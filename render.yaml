services:
  - type: web
    name: dairy-shop-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-shop-db
          property: connectionString
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: dairy-shop-web
          property: host
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: dairy-shop-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: dairy-shop-api
          property: host

databases:
  - name: dairy-shop-db
    plan: free
    databaseName: dairy_shop
    user: dairy_shop
